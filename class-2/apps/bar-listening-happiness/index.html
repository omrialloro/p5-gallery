async function search(term,country){

async function catalog(url,scriptUrl){
 try{
  const response=await fetch(url,{signal:AbortSignal.timeout(3600)});
  if(!response.ok)throw Error('catalog');
  return await response.json();
 }catch{return jsonp(scriptUrl);}
}
function jsonp(url){
 return new Promise((resolve,reject)=>{
  const name='listeningPreview'+(++callbackId), script=document.createElement('script');
  const done=(err,data)=>{clearTimeout(timer);script.remove();delete window[name];if(err)reject(err);else resolve(data);};
  const timer=setTimeout(()=>done(Error('timeout')),4500);
  window[name]=data=>done(null,data);
  script.onerror=()=>done(Error('search'));
  script.src=url+'&callback='+name;
  document.head.append(script);
 });
}
async function preview(p){

  const matches=await search(title.split(' - ')[0]+' '+p.artist,country);
  const ranked=matches.filter(x=>{

}

};
function credits(p){
 const names=new Set([...(groups[p.artist]||[p.artist==='Makaveli'?'2Pac':p.artist]),...(guests[p.title]||[]),...(guests[p.title+'|'+p.artist]||[])]);
 if(p.title==="I'm The Man (feat. Sonny Digital)")names.delete('Lloyd Banks');
 return names;
}
for(const artist of artists)artist.plays=plays.filter(p=>credits(p).has(artist.name));
function selectArtist(artist){
 chosen=artist;target=artist.mean;
 document.body.dataset.theme=target<.4?'dark':target<.6?'neutral':'bright';
 $('selected').textContent=artist.name;$('mood').textContent=(target<.4?'?? ':target<.6?'?? ':'?? ')+artist.mood;
 $('gauge').setAttribute('aria-label','��� ���� ������ �� '+artist.name+': '+artist.mood);
 document.querySelectorAll('.artist').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.name===artist.name)));
 $('another').disabled=artist.plays.length<2;
 randomTrack();
}
function randomTrack(){
 if(!chosen)return;
 const unique=[...new Map(chosen.plays.map(p=>[p.artist+'|'+p.title,p])).values()];
 const options=unique.filter(p=>p!==activePlay);
 activePlay=(options.length?options:unique)[Math.floor(Math.random()*(options.length||unique.length))];
 if(!activePlay)return;
 const p=activePlay,current=++token;
 audio.pause();audio.removeAttribute('src');audio.load();$('retry').hidden=true;
 $('title').textContent=p.title;$('singer').textContent=p.title==="I'm The Man (feat. Sonny Digital)"?'50 Cent':p.artist;
 $('cover').hidden=true;$('album').textContent='';$('status').textContent='���� ��� ������.';
 $('external').hidden=false;$('external').href='https://open.spotify.com/search/'+encodeURIComponent(p.title+' '+$('singer').textContent);
 loadTrack(p,current);
}
async function loadTrack(p,current){
 const key=p.artist+'|'+p.title;
 if(!cache.has(key))cache.set(key,Promise.allSettled([preview(p),deezer(p)]).then(r=>{
  const matches=r.flatMap(x=>x.status==='fulfilled'&&x.value?[x.value]:[]);
  if(!matches.length)cache.delete(key);return matches;
 }));
 const matches=await cache.get(key);if(current!==token)return;
 const artwork=matches.find(x=>x.art);
 if(artwork){$('cover').src=artwork.art;$('cover').alt='����� '+artwork.album;$('cover').hidden=false;$('album').textContent=artwork.album||'';}
 if(!matches.length){$('status').textContent='��� ���� �� ���� ����. ���� ����� ��� ��� �� ����� �?Spotify.';return;}
 for(const match of matches){
  if(current!==token)return;
  audio.src=match.url;
  try{await audio.play();if(current===token)$('status').textContent='������ ����� ������';return;}
  catch(error){if(current!==token)return;if(error.name==='NotAllowedError'){$('retry').hidden=false;$('status').textContent='������ ���� ����� �� ��� ������ ������.';return;}}
 }
 if(current===token)$('status').textContent='��� ���� �� ����� ������.';
}
$('retry').onclick=()=>{const current=token;audio.play().then(()=>{if(current===token){$('retry').hidden=true;$('status').textContent='������ ����� ������';}}).catch(()=>{$('status').textContent='������ ���� �� ���� ���� �� ����.';});};
$('another').onclick=randomTrack;
audio.addEventListener('ended',()=>{$('status').textContent='������ ������� �������. ���� ����� ��� ���.';});
$('cover').onerror=()=>{$('cover').hidden=true;};
let portraitPosition=0;
const portraits=[];
for(const artist of artists){
 const button=document.createElement('button');button.className='artist';button.dataset.name=artist.name;button.setAttribute('aria-pressed','false');
 const frame=document.createElement('div');frame.className='portrait';
 const initials=document.createElement('span');initials.textContent=artist.name.split(' ').map(x=>x[0]).slice(0,2).join('');
 const img=document.createElement('img');img.alt=artist.name;img.hidden=true;img.loading='lazy';img.onerror=()=>{img.hidden=true;};
 const label=document.createElement('b');label.textContent=artist.name;label.dir='auto';
 frame.append(initials,img);button.append(frame,label);button.onclick=()=>selectArtist(artist);$('artists').append(button);
 portraits.push({artist,img});
}
async function loadPortraits(){
 while(portraitPosition<portraits.length){
  const {artist,img}=portraits[portraitPosition++];
  try{
   const q=encodeURIComponent(artist.name==='KXNG Crooked'?'Crooked I':artist.name);
   const url='https://api.deezer.com/search/artist?limit=5&q='+q;
   const data=await catalog(url,url+'&output=jsonp');
   const hit=(data.data||[]).find(x=>normalize(x.name)===normalize(artist.name)||artist.name==='KXNG Crooked'&&normalize(x.name)==='crookedi');
   if(hit?.picture_medium){img.src=hit.picture_medium;img.hidden=false;}
  }catch{}
  await new Promise(r=>setTimeout(r,220));
 }
}
new p5(p=>{
 p.setup=()=>{p.createCanvas($('gauge').clientWidth,$('gauge').clientHeight).parent('gauge');p.pixelDensity(Math.min(2,window.devicePixelRatio||1));p.textFont('system-ui');};

  p.noStroke();p.fill(accent);const y=p.map(level,0,1,bottom,top+16);p.rect(cx-fluid/2,y,fluid,bottom-y,13);p.circle(cx,bottom,bulb*1.48);
  p.fill('#ffffff50');p.rect(cx-14,top+15,5,bottom-top-30,3);
  p.stroke(ink);p.strokeWeight(1);for(let i=0;i<=10;i++){const ty=p.map(i,0,10,bottom-25,top+14);p.line(cx+32,ty,cx+(i%5===0?48:40),ty);}
  p.noStroke();p.fill(ink);p.textSize(25);p.textAlign(p.CENTER,p.CENTER);
  p.text('??',cx-65,top+25);p.text('??',cx-65,(top+bottom)/2);p.text('??',cx-65,bottom-25);
  if(chosen){p.textSize(17);p.text(chosen.mood,cx,bottom+55);}
 };
});
