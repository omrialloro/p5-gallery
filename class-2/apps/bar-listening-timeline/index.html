const sketch=new p5(p=>{
 const colors=['#5343b8','#b33860','#007b72'];
 const visible=[true,true,true];
 const series=dates.map(date=>plays.map((song,i)=>({song,i})).filter(x=>x.song.date===date).sort((a,b)=>a.song.minute-b.song.minute));
 const size=()=>Math.max(1440,chart.clientWidth);
 const height=570;
 const legend=document.querySelector('#days');
 const activate=i=>{if(i!==active){select(i);p.redraw();}};
 p.setup=()=>{
  const canvas=p.createCanvas(size(),height);canvas.parent(chart);p.pixelDensity(1);
  canvas.elt.tabIndex=0;
  canvas.elt.setAttribute('aria-label','����� ���� ����� �� ����� �������. ���� ����� ��� ������� �� ���� �����.');
  const hit=e=>{
   keyboard=false;
   const bounds=canvas.elt.getBoundingClientRect();
   let closest=-1, distance=11;
   points.forEach(({x,y},i)=>{
    const d=Math.hypot(e.clientX-bounds.left-x,e.clientY-bounds.top-y);
    if(d<distance){distance=d;closest=i;}
   });
   canvas.elt.style.cursor=closest<0?'default':'pointer';
   if(closest>=0)activate(closest);
   return closest;
  };
  canvas.elt.addEventListener('pointermove',e=>{if(e.pointerType!=='touch')hit(e);});
  canvas.elt.addEventListener('click',e=>{
   hit(e);enableSound();
  });
  canvas.elt.addEventListener('pointerleave',()=>{canvas.elt.style.cursor='default';});
  canvas.elt.addEventListener('keydown',e=>{
   if(e.key==='Escape'){activate(-1);return;}
   if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;
   e.preventDefault();keyboard=true;
   const order=series.flatMap((day,i)=>visible[i]?day.map(x=>x.i):[]);
   if(!order.length)return;
   const step=['ArrowRight','ArrowDown'].includes(e.key)?1:-1;
   const at=order.indexOf(active);
   const i=order[at<0?0:(at+step+order.length)%order.length];
   activate(i);
   const x=points[i].x;
   if(x<chart.scrollLeft+45||x>chart.scrollLeft+chart.clientWidth-45)chart.scrollLeft=Math.max(0,x-chart.clientWidth/2);
  });
  days.forEach((day,i)=>{
   const control=document.createElement('button');
   control.type='button';control.textContent=day;control.style.setProperty('--day',colors[i]);control.setAttribute('aria-pressed','true');
   control.onclick=()=>{visible[i]=!visible[i];control.setAttribute('aria-pressed',String(visible[i]));if(!visible[i]&&plays[active]?.date===dates[i])select(-1);p.redraw();};
   legend.append(control);
  });
  p.textFont('system-ui');p.noLoop();
  new ResizeObserver(()=>{if(size()!==p.width)p.resizeCanvas(size(),height);}).observe(chart);
 };
 p.draw=()=>{
  p.clear();
  const left=66,right=p.width-38,top=27,bottom=524;
  const xAt=minute=>p.map(minute,420,1440,left,right);
  const yAt=score=>p.map(score,0,1,bottom,top);
  points=[];
  for(let band=0;band<5;band++){
   const y=yAt((band+1)/5);
   p.noStroke();const bg=p.color(moods[band][3]);bg.setAlpha(90);p.fill(bg);
   p.rect(left,y,right-left,(bottom-top)/5);
   p.textAlign(p.CENTER,p.CENTER);p.textSize(24);p.fill('#232235');p.text(moods[band][1],left/2,yAt((band+.5)/5));
  }
  p.strokeWeight(1);
  for(let hour=7;hour<=24;hour++){
   const x=xAt(hour*60);
   p.stroke('#29253a25');p.line(x,top,x,bottom);
   p.noStroke();p.fill('#49465a');p.textAlign(p.CENTER,p.CENTER);p.textSize(12);
   p.text((hour===24?'00':String(hour).padStart(2,'0'))+':00',x,bottom+19);
  }
  p.stroke('#29253a65');p.line(left,top,left,bottom);p.line(left,bottom,right,bottom);
  series.forEach((day,k)=>{
   if(!visible[k])return;
   p.noFill();p.stroke(colors[k]);p.strokeWeight(1.85);p.beginShape();
   day.forEach(({song,i})=>{
    const x=xAt(song.minute),y=yAt(song.score);
    points[i]={x,y,color:colors[k]};
    p.vertex(x,y);
   });
   p.endShape();
  });
  points.forEach(({x,y,color})=>{p.fill(color);p.stroke('#fff');p.strokeWeight(1.1);p.circle(x,y,7.5);});
  if(points[active]){
   const {x,y,color}=points[active];
   p.noFill();p.stroke(color);p.strokeWeight(1.7);p.circle(x,y,19);
   p.fill(color);p.stroke('#fff');p.strokeWeight(1.7);p.circle(x,y,12);
  }
 };
});
