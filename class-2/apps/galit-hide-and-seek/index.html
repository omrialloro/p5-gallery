<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מחבואים</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Heebo:wght@400;500;600&display=swap">
<style>
/* Layout: the photo is the stage; a narrow control strip sits beside it (below it on phones). */
:root {
  --bg: #e9ebe8;
  --surface: #f6f7f5;
  --fg: #1b1e1f;
  --muted: #5d6463;
  --line: #c9cdca;
  --accent: #2648c4;
  --accent-ink: #ffffff;
  --display: "Rubik", "Arial Hebrew", "Segoe UI", Arial, sans-serif;
  --body: "Heebo", "Arial Hebrew", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131516; --surface: #1c1f20; --fg: #e6e8e5; --muted: #9aa19f;
    --line: #333837; --accent: #8aa2ff; --accent-ink: #0d1330; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131516; --surface: #1c1f20; --fg: #e6e8e5; --muted: #9aa19f;
  --line: #333837; --accent: #8aa2ff; --accent-ink: #0d1330; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 32px;
}
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(30px, 5vw, 44px); line-height: 1; margin: 0; letter-spacing: -0.01em; }
header p { margin: 0; color: var(--muted); }
.credit { margin-inline-start: auto; font-size: 13px; color: var(--muted); }

.studio { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 20px; align-items: start; }
@media (max-width: 820px) { .studio { grid-template-columns: minmax(0, 1fr); } }

.stage { margin: 0; display: grid; gap: 10px; min-width: 0; }
.frame { background: #111; padding: 10px; border-radius: 4px; }
canvas { display: block; width: 100%; height: auto; cursor: pointer; touch-action: none; }
canvas.editing { cursor: crosshair; }
.status { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); }

.panel { display: grid; gap: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px; }
.group { display: grid; gap: 8px; }
.label { font-family: var(--display); font-weight: 500; font-size: 12px; letter-spacing: 0.06em; color: var(--muted); display: flex; justify-content: space-between; }
.label output { font-family: var(--body); color: var(--fg); font-variant-numeric: tabular-nums; letter-spacing: 0; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { text-align: center; padding: 8px 4px; cursor: pointer; font-weight: 500; border-inline-start: 1px solid var(--line); }
.seg label:first-of-type { border-inline-start: 0; }
.seg input:checked + label { background: var(--fg); color: var(--bg); }
.seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: -2px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
input[type=text], select { width: 100%; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 7px 9px; }
.buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
button, .file { font: inherit; font-weight: 600; border-radius: 5px; padding: 9px 10px; cursor: pointer; border: 1px solid var(--line); background: var(--bg); color: var(--fg); text-align: center; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button:focus-visible, .file:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: 0.45; cursor: default; }
.file input { position: absolute; width: 1px; height: 1px; opacity: 0; }

.check { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 500; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.editbar { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 14px; }
hr { border: 0; border-top: 1px solid var(--line); margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>מחבואים</h1>
    <p>כל התמונה מתמלאת. רק שלוש דמויות נשארות כמו שהיו.</p>
    <span class="credit">Galit Rossman · תרגיל 2</span>
  </header>

  <main class="studio">
    <figure class="stage">
      <div class="frame"><canvas id="cv" width="903" height="538" aria-label="תמונת הילדים"></canvas></div>
      <div class="bar"><i id="progress"></i></div>
      <figcaption class="status"><span id="status">טוען…</span><span id="count"></span></figcaption>
    </figure>

    <aside class="panel">
      <div class="group">
        <span class="label">ממה בנוי הכיסוי</span>
        <div class="seg" role="radiogroup" aria-label="סגנון הכיסוי">
          <input type="radio" name="mode" id="m-dots" value="dots" checked><label for="m-dots">נקודות</label>
          <input type="radio" name="mode" id="m-lines" value="lines"><label for="m-lines">קווים</label>
          <input type="radio" name="mode" id="m-letters" value="letters"><label for="m-letters">אותיות</label>
        </div>
      </div>

      <div class="group" id="text-group" hidden>
        <label class="label" for="letters">האותיות</label>
        <input type="text" id="letters" value="מחבואים" maxlength="40">
      </div>

      <div class="group">
        <label class="label" for="size">גודל <output id="size-out">9</output></label>
        <input type="range" id="size" min="5" max="20" step="1" value="9">
      </div>

      <div class="group">
        <label class="label" for="speed">משך בשניות <output id="speed-out">8</output></label>
        <input type="range" id="speed" min="2" max="20" step="1" value="8">
      </div>

      <div class="group">
        <label class="label" for="order">כיוון</label>
        <select id="order">
          <option value="ltr">משמאל לימין</option>
          <option value="rtl">מימין לשמאל</option>
          <option value="center">מהמרכז החוצה</option>
          <option value="random">אקראי</option>
        </select>
      </div>

      <label class="check" for="loop"><input type="checkbox" id="loop" checked> חזרה בלולאה: מתכסה, מתגלה ושוב</label>

      <div class="buttons">
        <button class="primary" id="play">הפעלה</button>
        <button id="reset">מההתחלה</button>
      </div>

      <p class="hint" id="hint">לחיצה על דמות בתמונה קובעת אם היא תכוסה או תישאר.</p>

      <hr>

      <div class="group">
        <label class="file" for="upload">העלאת תמונה אחרת<input type="file" id="upload" accept="image/*"></label>
        <button id="back" hidden>חזרה לתמונת הגן</button>
      </div>

      <div class="editbar" id="editbar" hidden>
        <p class="hint">גררו מלבן סביב כל מה שצריך להישאר. כל השאר יתכסה.</p>
        <div class="buttons">
          <button class="primary" id="done">סיימתי לסמן</button>
          <button id="undo">מחיקת סימון</button>
        </div>
      </div>
    </aside>
  </main>
</div>
<script src="sketch.js"></script>
</body>
</html>
